<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CBOM Scanner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background: #0a0e1a;
            color: #e6edf3;
            line-height: 1.6;
            min-height: 100vh;
            letter-spacing: -0.01em;
        }
        h1, h2, h3, h4, h5, h6 { font-family: 'Poppins', 'Inter', sans-serif; font-weight: 700; letter-spacing: -0.02em; }
        .navbar {
            background: rgba(19, 24, 41, 0.95);
            border-bottom: 1px solid #2a3050;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky; top: 0; z-index: 100;
        }
        .nav-brand h1 { color: #4a9eff; font-size: 1.4em; }
        .nav-links { display: flex; gap: 5px; }
        .nav-links a { color: #8b95b0; text-decoration: none; padding: 8px 16px; border-radius: 8px; transition: all 0.3s; font-size: 0.9em; }
        .nav-links a:hover { background: rgba(74, 158, 255, 0.1); color: #4a9eff; }

        .auth-container {
            display: grid; grid-template-columns: 1fr 1fr; max-width: 1100px;
            margin: 60px auto; min-height: 600px;
            background: linear-gradient(145deg, #1a1f35, #131829);
            border: 1px solid #2a3050; border-radius: 20px; overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }
        .auth-card { padding: 60px 50px; display: flex; flex-direction: column; justify-content: center; }
        .auth-header { text-align: center; margin-bottom: 40px; }
        .auth-icon { font-size: 3.5em; margin-bottom: 15px; display: inline-block; filter: drop-shadow(0 0 20px rgba(74, 158, 255, 0.5)); }
        .auth-header h1 { color: #4a9eff; font-size: 1.8em; margin-bottom: 8px; }
        .auth-header p { color: #8b95b0; font-size: 0.95em; }
        .auth-form { display: flex; flex-direction: column; gap: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-group label { color: #4a9eff; font-size: 0.85em; font-weight: 600; text-transform: uppercase; }
        .form-group input {
            padding: 14px 18px; background: #0a0e1a; border: 1px solid #2a3050;
            border-radius: 10px; color: #e6edf3; font-size: 1em; transition: all 0.3s;
            font-family: 'Inter', sans-serif;
        }
        .form-group input:focus { outline: none; border-color: #4a9eff; box-shadow: 0 0 20px rgba(74, 158, 255, 0.3); }
        .btn-auth {
            padding: 16px 24px; background: linear-gradient(135deg, #238636, #2ea043);
            color: white; border: none; border-radius: 10px; font-size: 1.05em;
            font-weight: 600; cursor: pointer; transition: all 0.3s;
            display: flex; justify-content: center; align-items: center; gap: 10px;
            margin-top: 10px; box-shadow: 0 4px 15px rgba(63, 185, 80, 0.3);
            font-family: 'Inter', sans-serif;
        }
        .btn-auth:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(63, 185, 80, 0.5); }
        .auth-message { padding: 12px 18px; border-radius: 10px; margin-top: 20px; text-align: center; font-size: 0.9em; }
        .auth-message.success { background: rgba(63, 185, 80, 0.1); border: 1px solid rgba(63, 185, 80, 0.3); color: #3fb950; }
        .auth-message.error { background: rgba(248, 81, 73, 0.1); border: 1px solid rgba(248, 81, 73, 0.3); color: #f85149; }
        .auth-footer { text-align: center; margin-top: 30px; padding-top: 25px; border-top: 1px solid #2a3050; }
        .auth-footer p { color: #8b95b0; font-size: 0.9em; }
        .auth-footer a { color: #4a9eff; text-decoration: none; font-weight: 600; }

        .auth-side {
            background: linear-gradient(145deg, rgba(74, 158, 255, 0.1), rgba(163, 113, 247, 0.1));
            padding: 60px 50px; display: flex; flex-direction: column; justify-content: center;
        }
        .auth-side h2 { color: #4a9eff; font-size: 1.8em; margin-bottom: 15px; }
        .auth-side > p { color: #8b95b0; font-size: 1em; margin-bottom: 40px; }
        .auth-features { display: flex; flex-direction: column; gap: 20px; }
        .auth-feature {
            display: flex; align-items: center; gap: 15px; padding: 15px 20px;
            background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px; transition: all 0.3s;
        }
        .auth-feature:hover { background: rgba(74, 158, 255, 0.1); border-color: rgba(74, 158, 255, 0.3); transform: translateX(8px); }
        .auth-feature span { font-size: 1.5em; }
        .auth-feature p { color: #e6edf3; font-size: 0.95em; margin: 0; }

        .hidden { display: none; }

        @media (max-width: 900px) {
            .auth-container { grid-template-columns: 1fr; margin: 30px 20px; }
            .auth-side { display: none; }
            .auth-card { padding: 40px 30px; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand"><h1>🔐 CBOM Scanner</h1></div>
        <div class="nav-links"><a href="/">Home</a><a href="/signup">Signup</a></div>
    </nav>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-icon">🔑</div>
                <h1>Welcome Back</h1>
                <p>Apne account mein login karo</p>
            </div>
            <form id="login-form" class="auth-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Enter your username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn-auth">Login →</button>
            </form>
            <div id="error-message" class="auth-message hidden"></div>
            <div class="auth-footer"><p>Account nahi hai? <a href="/signup">Signup karo</a></p></div>
        </div>
        <div class="auth-side">
            <h2>🔐 CBOM Scanner</h2>
            <p>Post-Quantum Cryptography Migration Tool for India</p>
            <div class="auth-features">
                <div class="auth-feature"><span>✅</span><p>Real-time TLS/SSH scanning</p></div>
                <div class="auth-feature"><span>✅</span><p>CycloneDX 1.6 CBOM reports</p></div>
                <div class="auth-feature"><span>✅</span><p>India NQM Roadmap 2027-2028</p></div>
                <div class="auth-feature"><span>✅</span><p>Charts & data visualization</p></div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const msgDiv = document.getElementById('error-message');
            msgDiv.classList.add('hidden');
            const formData = new FormData();
            formData.append('username', username);
            formData.append('password', password);
            try {
                const response = await fetch('/api/auth/login', { method: 'POST', body: formData });
                const data = await response.json();
                if (data.success) {
                    msgDiv.className = 'auth-message success';
                    msgDiv.textContent = '✅ Login successful! Redirecting...';
                    setTimeout(() => window.location.href = '/dashboard', 1000);
                } else {
                    msgDiv.className = 'auth-message error';
                    msgDiv.textContent = '❌ ' + data.error;
                }
            } catch (error) {
                msgDiv.className = 'auth-message error';
                msgDiv.textContent = '❌ Error: ' + error.message;
            }
        });
    </script>
</body>
</html>
