<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CBOM Scanner</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <h1>🔐 CBOM Scanner</h1>
        </div>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/signup">Signup</a>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-icon">🔑</div>
                <h1>Welcome Back</h1>
                <p>Apne account mein login karo</p>
            </div>

            <form id="login-form" class="auth-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Enter your username" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
                </div>

                <button type="submit" class="btn-auth">
                    <span>Login</span>
                    <span class="btn-arrow">→</span>
                </button>
            </form>

            <div id="error-message" class="auth-message error hidden"></div>

            <div class="auth-footer">
                <p>Account nahi hai? <a href="/signup">Signup karo</a></p>
            </div>
        </div>

        <div class="auth-side">
            <h2>🔐 CBOM Scanner</h2>
            <p>Post-Quantum Cryptography Migration Tool for India</p>
            <div class="auth-features">
                <div class="auth-feature">
                    <span>✅</span>
                    <p>Real-time TLS/SSH scanning</p>
                </div>
                <div class="auth-feature">
                    <span>✅</span>
                    <p>CycloneDX 1.6 CBOM reports</p>
                </div>
                <div class="auth-feature">
                    <span>✅</span>
                    <p>India NQM Roadmap 2027-2028</p>
                </div>
                <div class="auth-feature">
                    <span>✅</span>
                    <p>Charts & data visualization</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const msgDiv = document.getElementById('error-message');
            
            msgDiv.classList.add('hidden');
            
            const formData = new FormData();
            formData.append('username', username);
            formData.append('password', password);
            
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                
                if (data.success) {
                    msgDiv.className = 'auth-message success';
                    msgDiv.textContent = '✅ Login successful! Redirecting...';
                    setTimeout(() => window.location.href = '/dashboard', 1000);
                } else {
                    msgDiv.className = 'auth-message error';
                    msgDiv.textContent = '❌ ' + data.error;
                }
            } catch (error) {
                msgDiv.className = 'auth-message error';
                msgDiv.textContent = '❌ Error: ' + error.message;
            }
        });
    </script>
</body>
</html>
